<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpendWise | Personal Finance</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: #080d18; color: #f1f5f9;
      font-family: Arial, sans-serif;
      display: grid; place-items: center;
      padding: 24px;
    }
    main { max-width: 620px; text-align: center; }
    .logo { color: #67e8f9; font-size: 18px; font-weight: bold; }

    p { color: #a8b3c7; line-height: 1.7; }
    .tag {
      display: inline-block; margin-top: 18px;
      border: 1px solid #164e63; border-radius: 30px;
      padding: 10px 16px; color: #67e8f9;
    }
    footer { margin-top: 50px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <main>
    <div class="logo">◈ SPENDWISE</div>
    <h1>Take control of your money.</h1>
    <p>A personal finance and expense tracker designed to help you manage income, monitor spending, organize transactions, and plan monthly budgets.</p>
    <div class="tag">Personal Finance · DBMS Project</div>
    <footer>SpendWise — Personal Finance and Expense Tracker</footer>
  </main>

</html>
